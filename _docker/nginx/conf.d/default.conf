server {
    listen 80;
    server_name localhost;
    root /var/www/public;
    index index.php index.html;

    # Фото пользователя до 2 МБ (проверяется в Laravel), по умолчанию nginx пропускает 1 МБ
    client_max_body_size 3M;

    # Файлы диска public. Ссылка public/storage, созданная на Windows, внутри
    # контейнера не работает, поэтому каталог отдаётся напрямую, как на проде
    location ^~ /storage/ {
        alias /var/www/storage/app/public/;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;  # ← имя сервиса из docker-compose
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }

    # Кеширование статики
    location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}